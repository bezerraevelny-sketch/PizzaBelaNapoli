<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizzaria Bella Napoli</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins', sans-serif;
}

/* MENU */

header{
background:#111;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
}

header h1{
color:#ff6600;
}

nav a{
color:white;
margin-left:20px;
text-decoration:none;
font-weight:500;
}

nav a:hover{
color:#ff6600;
}

/* BANNER */

.banner{
height:80vh;
background:url("https://images.unsplash.com/photo-1601924638867-3ec3c59f0f06") center/cover;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;
}

.banner h2{
font-size:50px;
background:rgba(0,0,0,0.5);
padding:20px;
border-radius:10px;
}

/* PIZZAS */

.section{
padding:60px 40px;
text-align:center;
}

.section h2{
margin-bottom:40px;
font-size:35px;
}

.pizza-container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:30px;
}

.card{
width:250px;
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card h3{
margin:10px 0;
}

.card p{
padding:0 10px;
font-size:14px;
}

.card button{
margin:15px;
padding:10px 20px;
border:none;
background:#ff6600;
color:white;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

.card button:hover{
background:#e65c00;
}

/* FOOTER */

footer{
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

</style>
</head>

<body>

<header>
<h1>🍕 Bella Napoli</h1>

<nav>
<a href="#">Início</a>
<a href="#">Cardápio</a>
<a href="#">Contato</a>
</nav>
</header>

<section class="banner">
<h2>A Melhor Pizza da Cidade</h2>
</section>

<section class="section">

<h2>Nosso Cardápio</h2>

<div class="pizza-container">

<div class="card">
<img src="https://images.unsplash.com/photo-1604382355076-af4b0eb60143">
<h3>Calabresa</h3>
<p>Molho especial, queijo e calabresa.</p>
<button>Pedir</button>
</div>

<div class="card">
<img src="">
<h3>Frango com Catupiry</h3>
<p>Frango desfiado e catupiry cremoso.</p>
<button>Pedir</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1594007654729-407eedc4be65">
<h3>Quatro Queijos</h3>
<p>Mussarela, parmesão, provolone e gorgonzola.</p>
<button>Pedir</button>
</div>

</div>

</section>

<footer>
<p>© 2026 Pizzaria Bella Napoli</p>
</footer>

</body>
</html>
